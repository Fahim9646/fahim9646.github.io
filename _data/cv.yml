- title: Research Experience
  type: time_table
  contents:
    - title: Bedding-Plane Anisotropy at Sand and Sand-Concrete Interfaces
      institution: Department of Civil Engineering, RUET (with Md. Mahmud Sazzad)
      year: 2026
      description:
        - Ran 48 direct shear tests on a river sand and a crushed sand, sheared against themselves and against concrete, at four bedding angles and three normal stresses.
        - Built a two-dimensional DEM model (clumped grains, rolling-resistance contacts) and a calibrate-once-then-freeze protocol with blind predictions at other bedding angles.
    - title: Barriers to Green Buildings in Bangladesh
      institution: Department of Civil Engineering, RUET (with Sifat Shahriar)
      year: 2024
      description:
        - Designed and distributed a questionnaire (160 sent, 87 responses) and ranked seven barrier criteria with the Analytic Hierarchy Process (consistency ratio 0.011).

